name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Build site
        run: python3 build_site.py

      - name: Post-process SEO output
        run: python3 scripts/seo_postprocess.py

      - name: Verify no uncommitted generator drift
        run: |
          git diff --stat
          if ! git diff --quiet; then
            echo "::notice::Generated output was normalised by the deterministic SEO post-processor."
          fi

      - name: Validate generated output
        run: |
          python3 - <<'EOF'
          import sys, re
          from pathlib import Path

          errors = []
          root = Path(".")

          # Check required pages exist
          required = [
              "index.html", "404.html",
              "services/index.html",
              "services/residential-scaffolding/index.html",
              "services/commercial-scaffolding/index.html",
              "services/emergency-scaffolding/index.html",
              "contact/index.html",
              "quote/index.html",
              "about/index.html",
              "gallery/index.html",
              "robots.txt",
              "sitemap.xml",
          ]
          for p in required:
              if not (root / p).exists():
                  errors.append(f"Missing: {p}")

          # Check no old phone number appears in generated HTML.
          OLD_PHONE = "07713245511"
          for html in root.rglob("*.html"):
              content = html.read_text(encoding="utf-8", errors="ignore")
              if OLD_PHONE in content:
                  errors.append(f"Old phone number found in: {html}")

          # Placeholder verification tokens must never ship.
          for html in root.rglob("*.html"):
              content = html.read_text(encoding="utf-8", errors="ignore")
              if "REPLACE_WITH_GSC_CODE" in content:
                  errors.append(f"Placeholder GSC verification token found in: {html}")
              if 'name="revisit-after"' in content:
                  errors.append(f"Obsolete revisit-after meta found in: {html}")

          # Area pages must breadcrumb to the real Areas page, not a homepage fragment.
          for html in (root / "areas").glob("*/index.html"):
              content = html.read_text(encoding="utf-8", errors="ignore")
              if "#areas-covered" in content:
                  errors.append(f"Homepage-fragment breadcrumb remains in: {html}")

          # Homepage area pills must point to area pages rather than every pill pointing to Contact.
          homepage = (root / "index.html").read_text(encoding="utf-8", errors="ignore")
          for name, slug in {
              "Benfleet": "benfleet", "Canvey Island": "canvey-island", "Rayleigh": "rayleigh",
              "Southend-on-Sea": "southend", "Basildon": "basildon", "Chelmsford": "chelmsford",
              "Wickford": "wickford", "Hadleigh": "hadleigh", "Leigh-on-Sea": "leigh-on-sea",
              "Thundersley": "thundersley", "Hockley": "hockley", "Rochford": "rochford",
          }.items():
              if f'href="/areas/{slug}">{name}</a>' not in homepage:
                  errors.append(f"Homepage area link missing for: {name}")

          # Check sitemap does not contain noindex pages.
          sitemap = (root / "sitemap.xml").read_text()
          noindex_in_sitemap = [p for p in ["/thank-you", "/privacy-policy", "/terms-and-conditions", "/cookie-policy"] if p in sitemap]
          if noindex_in_sitemap:
              errors.append(f"Noindex pages in sitemap: {noindex_in_sitemap}")

          # Sitemap URLs should match the site's canonical non-trailing-slash strategy.
          for loc in re.findall(r"<loc>(.*?)</loc>", sitemap):
              if loc != "https://www.axisscaffoldingessex.co.uk/" and loc.endswith("/"):
                  errors.append(f"Trailing-slash sitemap URL conflicts with canonical strategy: {loc}")

          # Preferred canonical hostname is WWW. The bare (non-www) hostname is a valid
          # *redirect source* (GitHub Pages, via CNAME, 301s it to the www host) but must
          # never appear as an outgoing URL — canonical, sitemap, schema, OG, hreflang,
          # or internal absolute link. A bare-host URL used as a destination is a
          # canonical/redirect/sitemap signal conflict per Google's own guidance on
          # keeping those signals consistent.
          BARE_HOST_PATTERN = re.compile(r"(?<!www\.)axisscaffoldingessex\.co\.uk")
          for html in root.rglob("*.html"):
              content = html.read_text(encoding="utf-8", errors="ignore")
              if BARE_HOST_PATTERN.search(content):
                  errors.append(f"Bare (non-www) hostname used as an outgoing URL in: {html}")
          if BARE_HOST_PATTERN.search(sitemap):
              errors.append("Bare (non-www) hostname found in sitemap.xml")

          # Check robots.txt has the intended crawlers.
          robots = (root / "robots.txt").read_text()
          for bot in ["OAI-SearchBot", "Googlebot", "Bingbot"]:
              if bot not in robots:
                  errors.append(f"Missing {bot} in robots.txt")
          if BARE_HOST_PATTERN.search(robots):
              errors.append("Bare (non-www) hostname found in robots.txt")
          if "Sitemap: https://www.axisscaffoldingessex.co.uk/sitemap.xml" not in robots:
              errors.append("robots.txt Sitemap directive does not point at the www canonical host")

          # CNAME must declare the www host as GitHub Pages' canonical hostname —
          # this is what makes GitHub Pages 301 the bare host to www at the edge.
          cname = (root / "CNAME").read_text().strip()
          if cname != "www.axisscaffoldingessex.co.uk":
              errors.append(f"CNAME does not declare the www canonical host (found: {cname!r})")

          # Legacy redirect targets must not be unrelated homepage fragments.
          redirects = (root / "_redirects").read_text()
          if "#areas-covered" in redirects:
              errors.append("_redirects still contains homepage-fragment redirects")
          if "/services/supply-erection.html /services/domestic-scaffolding" in redirects:
              errors.append("Legacy supply/erection redirect still points to domestic scaffolding")
          if "/services/dismantling.html /services/emergency-scaffolding" in redirects:
              errors.append("Legacy dismantling redirect still points to emergency scaffolding")
          if "/services/loading-bays.html /services/roof-scaffolding" in redirects:
              errors.append("Legacy loading-bay redirect still points to roof scaffolding")

          if errors:
              print("Validation errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print("Validation passed.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
