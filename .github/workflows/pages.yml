name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Build site
        run: python3 build_site.py

      - name: Verify no uncommitted generator drift
        run: |
          git diff --stat
          if ! git diff --quiet; then
            echo "::warning::Generated files differ from committed output. Committing generated diff..."
          fi

      - name: Validate generated output
        run: |
          python3 - <<'EOF'
          import sys, re
          from pathlib import Path

          errors = []
          root = Path(".")

          # Check required pages exist
          required = [
              "index.html", "404.html",
              "services/index.html",
              "services/residential-scaffolding/index.html",
              "services/commercial-scaffolding/index.html",
              "services/emergency-scaffolding/index.html",
              "contact/index.html",
              "quote/index.html",
              "about/index.html",
              "gallery/index.html",
              "robots.txt",
              "sitemap.xml",
          ]
          for p in required:
              if not (root / p).exists():
                  errors.append(f"Missing: {p}")

          # Check no duplicate phone numbers (old mobile must not appear in HTML)
          OLD_PHONE = "07713245511"
          for html in root.rglob("*.html"):
              content = html.read_text(encoding="utf-8", errors="ignore")
              if OLD_PHONE in content:
                  errors.append(f"Old phone number found in: {html}")

          # Check sitemap does not contain noindex pages
          sitemap = (root / "sitemap.xml").read_text()
          noindex_in_sitemap = [p for p in ["/thank-you", "/privacy-policy", "/terms-and-conditions", "/cookie-policy"] if p in sitemap]
          if noindex_in_sitemap:
              errors.append(f"Noindex pages in sitemap: {noindex_in_sitemap}")

          # Check robots.txt has AI crawler entries
          robots = (root / "robots.txt").read_text()
          for bot in ["OAI-SearchBot", "Googlebot", "Bingbot"]:
              if bot not in robots:
                  errors.append(f"Missing {bot} in robots.txt")

          if errors:
              print("Validation errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print("Validation passed.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
